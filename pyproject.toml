[project]
name = "dialt-interview-demo"
version = "0.1.0"
description = "A short guided voice interview built with Dialt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dialt-sdk>=0.39.1",
  "fastapi>=0.116",
  "httpx>=0.28",
  "python-dotenv>=1.0",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interview_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
